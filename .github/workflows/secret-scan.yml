name: secret-scan

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:   # manual run scans the full history

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned version, checksum verified)
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      # PRs and pushes scan only the new commits. Old history still contains the
      # .env leak from before Phase A; that is fixed by rotating the credentials
      # (see fix/STATE.md), not by failing every build forever.
      - name: Scan new commits
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD_SHA --not --remotes=origin/master"
          else
            RANGE="$BASE..$HEAD_SHA"
          fi
          echo "Scanning: $RANGE"
          ./gitleaks git . --log-opts="$RANGE" -c .gitleaks.toml --redact --no-banner --verbose

      - name: Scan full history (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: ./gitleaks git . -c .gitleaks.toml --redact --no-banner --verbose
